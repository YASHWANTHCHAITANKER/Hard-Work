<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chapter set-2</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            height: 100vh;
            width: 100vw;
            background-color:aquamarine
        }
        header {
            height: 50px;
            width: 100vw;
            background-color: rgb(35, 150, 87);
            color: burlywood;
        }
        ul{
            display: inline-flex;
            padding: 15px;
        }
        li{
            list-style: none;
            margin-right: 25px;
        }
        .box1{
            height: 2px;
            width: 100vw;
            background-color:black;
            transition-property: width;
            transition-duration: 3s;
            transition-timing-function: ease-in-out;
        }
        .box1:hover{
            width: 1px;
        }
        
    </style>
</head>

<body>
    <div class="box1"></div>
    <header>
        <nav>
            <ul>
                <li>HOME</li>
                <li>ABOUT US</li>
                <li>CONTACT US</li>
            </ul>
        </nav>
    </header>
    <div class="container"></div>
</body>

</html>
