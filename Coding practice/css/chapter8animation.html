<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animations </title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            height: 100vh;
            width: 100vw;
            background-color: aqua;
            /* display: flex;
            justify-content: center;
            align-items: center; */
        }
        .box1{
            height: 250px;
            width: 400px;
            background-color: chartreuse;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            /* border: 2px solid black; */
            /* transform: translate(500px,200px); */
            /* animation-name: animation;
            animation-duration: 3s;
            animation-delay: 1s;
            animation-iteration-count: 10;
            animation-direction: alternate;
            animation-timing-function: ease-in-out; */
            /* animation: animation 3s infinite alternate ease-in; */
        }
        img{
            animation: animation1 3s infinite alternate ease-in-out;
        }
        @keyframes animation{
            from{
                width: 400px;
                height: 250px;
            }
            to{
                width: 100vw;
                height: 100vh;
            }
        }
        @keyframes animation1{
            0%{
                width: 40px;
                height: 40px;
            }
            25%{
                width: 350px;
                height: 150px;
            }
            50%{
                width: 550px;
                height: 300px;
            }
            75%{
                width: 850px;
                height: 500px;
            }
            100%{
                width: 1200px;
                height: 650px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- <div class="box1">  </div> -->
        <img src="dragon2.png" alt="dragon logo" height="100px"> 
    </div>

</body>
</html>
